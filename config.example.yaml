# Структурные настройки personal_notify.
# Скопируйте в config.yaml и отредактируйте. Секреты — в .env.

ollama:
  base_url: "http://127.0.0.1:11434"   # можно переопределить переменной OLLAMA_BASE_URL
  default_model: "qwen3:8b"            # список моделей: ollama list
  request_timeout: 180                 # запас на холодный старт модели
  options:
    temperature: 0.4
  prompts:
    notify: >-
      Оформи данные о погоде компактно и только на русском языке, без пустых строк.
      Сохрани уже готовую структуру строк как есть, не переставляй параметры между строками
      и не добавляй того, чего нет во входных данных, не пиши пояснений.
      Для выделения используй только HTML-теги Telegram (<b>жирный</b>, <i>курсив</i>),
      без Markdown (символы * и #).
    news_filter: >-
      Тебе дан список новостных постов, каждый с номером в формате [N].
      Верни только номера постов, которые относятся к нежелательным темам,
      через запятую (например: 2, 5, 7). Если таких нет — верни пустую строку.
      Не пиши пояснений.
    news_digest: >-
      Сделай из новостных постов компактную сводку на русском, сгруппированную по темам.
      Каждая тема — строка с заголовком в <b>...</b>, под ней пункты.
      В конце каждого пункта укажи источники в виде [N] (номера исходных постов).
      Не выдумывай фактов, используй только HTML-теги Telegram (<b>, <i>),
      без Markdown (символы * и #).

weather:
  provider: "gismeteo"
  silent: false           # true — отправлять оповещение без звука
  location:
    city: "Москве"        # отображается в заголовке: «Погода в <city>»
    latitude: 55.7558
    longitude: 37.6173

storage:
  backend: "sqlite"
  path: "data/notify.db"

news:
  enabled: false          # true — включить ежедневный дайджест
  sources:                # каналы: username или ссылка t.me/...
    - "durov"
    - "meduzalive"
  window_hours: 24        # окно сбора постов
  exclude_topics:         # темы, которые убирать (по смыслу, через LLM)
    - "Трамп"
    - "политика США"
  max_posts: 200          # лимит постов за окно
  max_post_chars: 600     # обрезка длинных постов перед LLM
  silent: true            # отправлять дайджест без звука
