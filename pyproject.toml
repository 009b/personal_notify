[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-notify"
version = "0.1.0"
description = "Personal Telegram notification bot"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",   # Ollama, Gismeteo
    "PyYAML>=6",     # config.yaml
    # storage: sqlite3 (stdlib)
    # scheduler: системный cron
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
